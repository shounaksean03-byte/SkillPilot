spring.application.name=lms-backend

# ---- PostgreSQL connection (Supabase-hosted) ----
# Direct connection (db.<ref>.supabase.co:5432) — correct choice for a
# persistent backend with its own connection pool (HikariCP), not a
# serverless one. Note: direct connections are IPv6-only unless the project
# has the IPv4 add-on enabled; if this doesn't connect from your network,
# switch to the Session Pooler host from the Supabase dashboard instead.
# sslmode=require encrypts the connection (Supabase requires SSL).
#
# Never hardcode the real password here. Set it as an environment variable
# before running: `export DB_PASSWORD=...` (or put it in an untracked
# application-local.properties and run with --spring.profiles.active=local).
spring.datasource.url=jdbc:postgresql://db.dzwdeyyahawmrgrlrngg.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Flyway ----
# Versioned SQL migrations under src/main/resources/db/migration are now the
# source of truth for the schema (see V1__init_schema.sql). baseline-on-migrate
# lets Flyway adopt an already-existing schema (e.g. one previously created by
# Hibernate's ddl-auto=update) without erroring — it stamps whatever's already
# there as baseline version 0 and applies only newer migrations on top.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---- JPA / Hibernate ----
# validate: checks entities match the schema Flyway manages, but never
# creates/alters tables itself. Add new columns/tables via a new
# Vn__description.sql migration file, then update the entity to match —
# never the other way around.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# No spring.jpa.database-platform override: Hibernate 6 autodetects the
# PostgreSQL dialect from the JDBC connection.

server.port=8080

# ---- CORS ----
# Origins allowed to call this API directly from the browser (the frontend is
# a separate origin, not proxied through anything). Comma-separated; add the
# frontend's deployed origin here too once it has one.
app.cors.allowed-origins=http://localhost:3000,http://localhost:3100
